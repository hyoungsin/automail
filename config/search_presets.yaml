# 3단계: Gmail 검색 쿼리 (https://support.google.com/mail/answer/7190)
# 예: 지난 24시간, 프로모션 제외, 주요 수신함 위주
presets:
  - id: last_24h_primary
    name: "최근 24시간(프로모션 제외·주요)"
    query: "newer_than:1d -category:promotions category:primary"
    enabled: true
    max_messages: 40

  - id: unread_important
    name: "읽지 않은 중요 메일"
    query: "is:unread is:important newer_than:1d"
    enabled: false
    max_messages: 25
