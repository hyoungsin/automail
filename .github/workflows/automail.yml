name: automail gmail digest

on:
  schedule:
    # 08:00 KST = 23:00 UTC (previous day)
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: automail-gmail-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      # Gmail OAuth paths in workspace
      GMAIL_CREDENTIALS_PATH: credentials/client_secret.json
      GMAIL_TOKEN_PATH: token.json

      # Recipients / mode
      USE_PRODUCTION_RECIPIENT: "1"
      DIGEST_PRODUCTION_RECIPIENT: ${{ secrets.DIGEST_PRODUCTION_RECIPIENT }}
      CREATE_GMAIL_DRAFT: "0"
      AUTO_SEND: "1"
      DRY_RUN: "0"

      # LLM (테스트: Genspark)
      LLM_PROVIDER: genspark
      GENSPARK_API_KEY: ${{ secrets.GENSPARK_API_KEY }}
      GENSPARK_BASE_URL: ${{ secrets.GENSPARK_BASE_URL }}
      GENSPARK_TASK_TYPE: ${{ secrets.GENSPARK_TASK_TYPE }}
      GENSPARK_PROJECT_ID: ${{ secrets.GENSPARK_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Gmail OAuth files from secrets
        run: |
          mkdir -p credentials
          python - <<'PY'
          import os, json, pathlib
          root = pathlib.Path(".").resolve()
          # client_secret.json (required)
          cs = os.environ.get("GMAIL_CLIENT_SECRET_JSON", "").strip()
          if not cs:
            raise SystemExit("Missing secret: GMAIL_CLIENT_SECRET_JSON")
          (root / "credentials" / "client_secret.json").write_text(cs, encoding="utf-8")
          # token.json (required for headless refresh)
          tok = os.environ.get("GMAIL_TOKEN_JSON", "").strip()
          if not tok:
            raise SystemExit("Missing secret: GMAIL_TOKEN_JSON")
          # basic sanity
          json.loads(tok)
          (root / "token.json").write_text(tok, encoding="utf-8")
          print("Wrote credentials/client_secret.json and token.json")
          PY
        env:
          GMAIL_CLIENT_SECRET_JSON: ${{ secrets.GMAIL_CLIENT_SECRET_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}

      - name: Ensure Genspark key present
        run: |
          python - <<'PY'
          import os
          key = (os.environ.get("GENSPARK_API_KEY") or "").strip()
          if not key:
            raise SystemExit("Missing secret: GENSPARK_API_KEY (Genspark refine will be skipped otherwise)")
          print("Genspark key present")
          PY

      - name: Run digest (send)
        run: |
          python scripts/gmail_digest.py

